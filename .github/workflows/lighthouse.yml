name: Portfolio Lighthouse audit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse mobile audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build production site
        run: npm run build
      - name: Wait for matching Cloudflare deployment
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error "https://portfolio-agustin.agustinkbral2013.workers.dev/" --output /tmp/portfolio-live.html 2>/dev/null \
              && cmp --silent dist/index.html /tmp/portfolio-live.html; then
              echo "The deployed HTML matches this commit."
              exit 0
            fi
            echo "Waiting for Cloudflare deployment (attempt $attempt/30)..."
            sleep 10
          done
          echo "Timed out waiting for the matching Cloudflare deployment."
          exit 1
      - name: Audit deployed website
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://portfolio-agustin.agustinkbral2013.workers.dev/
          runs: 3
          uploadArtifacts: true
          temporaryPublicStorage: true
